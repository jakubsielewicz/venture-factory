name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint the crew (frontmatter, ledgers, JSON, Agent tokens)
        run: python automation/lint.py
      - name: Guardrail regression tests (guard.py / gate.py / spend.py)
        run: python .claude/hooks/test_guard.py
      - name: Compile all hook + automation scripts
        run: python -m compileall -q .claude/hooks automation
